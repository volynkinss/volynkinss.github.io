<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f4f5f2">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:image" content="https://volynkinss.github.io/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1733">
  <meta property="og:image:height" content="908">
  <meta property="og:image:alt" content="Sergey Volynkin — Software &amp; Platform Engineer. Three sage architectural layers.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://volynkinss.github.io/og.png">
  <meta name="twitter:image:alt" content="Sergey Volynkin — Software &amp; Platform Engineer. Three sage architectural layers.">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
  <script id="structured-data" type="application/ld+json">{{structuredData}}</script>
</head>
<body data-lang="{{lang}}">
  <div id="resume-app">{{appHtml}}</div>
  <script type="module" src="script.js"></script>

</html>
